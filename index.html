<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Apinator 受信テスト</title>
</head>
<body>
  <h1>Apinator 待機中...</h1>
  <p>受信したデータは画面とコンソールに表示されます。</p>
  <pre id="output"></pre>

  <script type="module">
    // CDN（esm.sh）から直接インポート
    import { Apinator } from 'https://esm.sh';

    const client = new Apinator({ 
      appKey: 'app_6833eec80472cce54f689551933e89fb5defb8cc', 
      cluster: 'us' 
    });
    
    client.connect();

    client.subscribe('my-channel').bind('my-event', (data) => {
      console.log('Received:', data);
      // 画面にも表示させる処理
      document.getElementById('output').textContent += JSON.stringify(data) + '\n';
    });
  </script>
</body>
</html>
